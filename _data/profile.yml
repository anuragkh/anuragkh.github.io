bio: >-
  Anurag Khandelwal is an Associate Professor of Computer Science at Yale
  University, where his group focuses broadly on problems in computer systems,
  networks and security. He received his Ph.D. from UC Berkeley, where he was
  advised by Ion Stoica. His work has been recognized by an NSF CAREER award,
  two NetApp faculty fellowships, a Roberts Innovation Award, paper and artifact
  distinctions at USENIX Security’20, ISCA’23, EuroSys’24, ISCA’25, ASPLOS'26,
  and MobiSys'26, and IEEE Micro Top Picks selections in 2023 and 2025.
