# Add a research direction:
# - name: Direction Name
#   status: active        # or: past
#   summary: >-
#     One paragraph on the problem and the approach taken.
#   threads:
#     - >-
#       Short description of a line of work: [VENUE'YY](/papers/key/), ...
#   note: >-
#     Optional closing sentence, e.g. where the work has been adopted.
#
# Directions are listed in display order. The website shows active ones and
# folds past ones behind a disclosure.

- name: Memory Disaggregation
  status: active
  summary: >-
    Scaling resources at server granularity wastes resources when compute
    and memory needs are mismatched, increasing both costs and carbon
    emissions. Memory disaggregation separates compute and memory into
    shared network-connected pools to improve resource efficiency, capacity,
    and elasticity. We are rethinking the cloud software and hardware stack
    to realize memory disaggregation:
  threads:
    - >-
        Scalable cache coherence for disaggregated shared memory pools:
        [MIND](/papers/mind/) (SOSP'21), [CORD](/papers/cord/) (ISCA'25),
        [Soul](/papers/soul/) (OSDI'26)
    - >-
        Fair sharing across disaggregated memory resources:
        [Karma](/papers/karma/) (OSDI'23), [Spirit](/papers/spirit/) (SOSP'25)
    - >-
        Low-latency, high-throughput access to disaggregated memory:
        [PULSE](/papers/pulse/) (ASPLOS'25), [Mage](/papers/mage/) (SOSP'25)
    - >-
        Understanding memory performance: [BulletTime](/papers/bullettime/) (ISCA'26),
        [CounterPoint](/papers/counterpoint/) (ASPLOS'26)
  note: >-
    Our work on scalable cache coherence for disaggregated memory has been
    incorporated into [NVIDIA's Vera Rubin
    Architecture](https://developer.nvidia.com/blog/inside-nvidia-rubin-gpu-architecture-powering-the-era-of-agentic-ai/#accelerated_scale-up_communications).

- name: Secure cloud systems
  status: active
  summary: >-
    As more privacy-sensitive applications move storage and computation to
    the cloud, encrypted data and secure enclaves can still leak sensitive
    information through access patterns. Existing defenses are often too
    expensive in bandwidth or storage to deploy widely. Our research studies
    these real-world access-pattern vulnerabilities and designs more
    efficient protections against them.
  threads:
    - >-
        Protecting against access pattern vulnerabilities: [Pancake](/papers/pancake/) (USENIX
        Sec'20), [Shortstack](/papers/shortstack/) (OSDI'22),
        [Weave](/papers/weave/) (OSDI'25)
    - >-
        Understanding access pattern vulnerabilities: [Length Leakage](/papers/length-leakage/) (USENIX
        Sec'24), [Found in Translation](/papers/fit/) (USENIX
        Sec'25)

- name: Systems for AI
  status: active
  summary: >-
    Today’s AI serving systems waste substantial time and resources because
    they treat requests as independent and unpredictable, even though real
    workloads contain rich recurring structure in both arrival patterns and
    prompt content. We are building cloud AI serving platforms that treat
    workload structure as a first-class systems primitive:
  threads:
    - >-
        Scheduling for low-latency, high-throughput AI inference:
        [Shepherd](/papers/shepherd/) (NSDI'23), [TimelyLLM](/papers/timelyllm/) (MobiSys'26)
    - >-
        Caching attention state across prompts for low-latency inference:
        [PromptCache](/papers/promptcache/) (MLSys'24)
  note: >-
    [PromptCache](/papers/promptcache/) has been adopted in Gemini,
    OpenAI, and Anthropic for reusing attention states across LLM prompts.

- name: Storage and processing stacks for automated data
  status: active
  summary: >-
    Emerging applications that rely on automated data sources --- ranging
    from smart vehicles to brain implants --- require processing, storing,
    and serving massive volumes of semantically rich data. We are developing
    systems for efficient ingestion of data without compromising query and
    processing performance by exploiting properties specific to
    machine-generated data:
  threads:
    - >-
        High-throughput compressed storage of high-dimensional data:
        [Trinity](/papers/trinity/) (EuroSys'24)
    - >-
        Distributed system for scalable Brain-Computer Interfacing (BCI):
        [SCALO](/papers/scalo/) (ISCA'23), [MICRO Top
        Picks'23](/papers/scalo-toppicks/)
    - >-
        Distributed monitoring & diagnosis for high speed networks:
        [Confluo](/papers/confluo/) (NSDI'19)

- name: Serverless Systems
  status: past
  summary: >-
    Serverless analytics workloads increasingly demand fine-grained, rapidly
    changing compute and memory resources, but existing cloud systems manage
    them too coarsely, forcing a tradeoff between performance and
    utilization under bursty, time-varying demand. We built a serverless
    analytics stack that treats elasticity and workload-aware multiplexing
    as first-class primitives:
  threads:
    - >-
        Position papers: [Berkeley View on Serverless](/papers/berkeley-view-serverless/) (Tech Report),
        [Le Taureau](/papers/sigmodserverless/) (SIGMOD'20),
        [What Serverless Should Become](/papers/serverless-next/) (CACM'21)
    - >-
        Enabling fast and cost-effective analytics over serverless
        functions: [Caerus](/papers/caerus/) (NSDI'21),
        [Jiffy](/papers/jiffy/) (EuroSys'22)

- name: Queries on compressed data
  status: past
  summary: >-
    As datasets grow beyond DRAM capacity, maintaining interactive query
    performance becomes difficult because spilling to slower secondary
    storage increases latency and lowers throughput. We developed systems
    that address this challenge using a fundamentally new approach: enabling
    rich query execution directly on compressed data, reducing the need to
    fully decompress or rely on large DRAM footprints.
  threads:
    - >-
        Enabling queries on compressed data:
        [Succinct](/papers/succinct/) (NSDI'15), [ZipG](/papers/zipg/) (SIGMOD'17),
        [Queries on Compressed Data](/papers/phdthesis/) (PhD Thesis)
    - >-
        Dynamic storage-performance tradeoff in data stores:
        [BlowFish](/papers/blowfish/) (NSDI'16)
