name: Build and deploy Jekyll site

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets _plugins/last_modified.rb date sitemap entries.
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Generate CV sources
        run: ruby scripts/generate_cv.rb

      - name: Build CV
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            cd cv
            mkdir -p build
            pdflatex -output-directory=build src/cv.tex
            biber --input-directory build --output-directory build cv
            pdflatex -output-directory=build src/cv.tex
            pdflatex -output-directory=build src/cv.tex
            cp build/cv.pdf cv.pdf

      - name: Install dependencies
        run: bundle install

      # Enriches any bib entry that has no _data/paper_details.yml record yet.
      # The script only appends, uses the Ruby stdlib, and always exits 0, so a
      # metadata API being slow or down can never block a deploy.
      - name: Fetch missing paper metadata
        run: ruby scripts/fetch_paper_details.rb
        continue-on-error: true

      - name: Build site
        run: bundle exec jekyll build --destination ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
